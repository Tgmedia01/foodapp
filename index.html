function packPrice(id,shop=state.store){const key=shop+'|'+id;if(Object.hasOwn(state.priceOverrides,key))return Math.max(0,Number(state.priceOverrides[key])||0);return Math.max(0,Number(pFor(id).prices?.[shop])||0)}
function hasPrice(id){return Object.hasOwn(state.priceOverrides,state.store+'|'+id)||Number(pFor(id).prices?.[state.store])>0}
function quantityText(quantity,unit){const q=Math.round(quantity*10)/10;return `${q} ${unit==='pcs'?(q===1?'item':'items'):unit}`}
function ingredientText(ing){const p=pFor(ing.product);return `${p.name} · ${quantityText(ing.quantity*state.servings/4,p.unit)}`}
function getCart(plan=state.plan,options={}){const byId=new Map();for(const rid of plan){const r=rFor(rid);if(!r)continue;for(const ing of r.ingredients){const id=ing.product;const qty=ing.quantity*state.servings/4;byId.set(id,(byId.get(id)||0)+qty)}}let entries=[];for(const [id,needed] of byId){if(state.pantry.includes(id))continue;const p=pFor(id);const packs=Math.max(1,Math.ceil(needed/Math.max(.0001,Number(p.pack)||1)));const unitPrice=packPrice(id);entries.push({id,name:p.name,aisle:p.aisle||'Other',needed,packs,price:round(packs*unitPrice),unitPrice,known:hasPrice(id),isExtra:false,checked:state.checked.includes('p:'+id),packLabel:`${packs} × ${p.pack} ${p.unit} pack${packs===1?'':'s'}`})}
if(options.includeExtras!==false)for(const extra of state.extras){const price=state.priceOverrides[state.store+'|extra:'+extra.id];const unitPrice=price===undefined?Number(extra.prices?.[state.store]||0):Number(price)||0;entries.push({id:'extra:'+extra.id,name:extra.name,aisle:extra.aisle||'Other',needed:extra.quantity||1,packs:Math.max(1,Number(extra.quantity)||1),price:round((Math.max(1,Number(extra.quantity)||1))*unitPrice),unitPrice,known:Number.isFinite(Number(price))&&price!==undefined||Number(extra.prices?.[state.store])>0,isExtra:true,checked:state.checked.includes('p:extra:'+extra.id),packLabel:`${extra.quantity||1} pack${Number(extra.quantity)===1?'':'s'}`})}
entries.sort((a,b)=>{const i=AISLES.indexOf(a.aisle),j=AISLES.indexOf(b.aisle);return (i<0?999:i)-(j<0?999:j)||a.name.localeCompare(b.name)});
return {entries,total:round(entries.reduce((sum,x)=>sum+x.price,0)),unknown:entries.filter(x=>!x.known).length,done:entries.filter(x=>x.checked).length}}
function canUse(r){const ingr=r.ingredients.map(i=>pFor(i.product).name.toLowerCase()).join(' • ');const avoid=state.avoid.toLowerCase().split(/[,\n;]/).map(x=>x.trim()).filter(Boolean);if(avoid.some(a=>ingr.includes(a)))return false;if(state.diet==='vegetarian'&&!r.tags.includes('vegetarian'))return false;
if(state.diet==='dairy-free'&&r.ingredients.some(i=>['halloumi','cheddar','mozzarella','cream','creamcheese','milk','butter','yoghurt'].includes(i.product)))return false;
if(state.diet==='gluten-free'&&r.ingredients.some(i=>['wraps','buns','pitta','bread','noodles','pasta','spaghetti','orzo','couscous','flour','breadcrumbs','soy'].includes(i.product)))return false;
if(state.diet==='pescatarian'&&r.ingredients.some(i=>['chicken','thigh','mince','beef','burgers','sausages'].includes(i.product)))return false;
return r.appliances.every(a=>state.appliances.includes(a));}
function validRecipes(){return recipes().filter(canUse)}
function generatePlan(){const choices=validRecipes();if(!choices.length){toast('No matching meals. Try removing a food restriction or adding an appliance.');return false}let best=null,bestScore=Infinity;const trials=500;for(let t=0;t<trials;t++){const copy=[...choices];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}const chosen=Array.from({length:7},(_,i)=>copy[i%copy.length]?.id).filter(Boolean);if(chosen.length<7)continue;const cart=getCart(chosen),over=Math.max(0,cart.total-state.budget);const weeks=chosen.map(x=>rFor(x));const varied=new Set(weeks.map(x=>x.category)).size;let score=cart.total*.18+over*10-varied*3;
for(const r of weeks){if(state.priorities.includes('quick')&&r.time>30)score+=4;if(state.priorities.includes('high-protein')&&r.protein<35)score+=3;if(state.priorities.includes('family')&&!r.tags.includes('family'))score+=4;if(state.priorities.includes('budget')&&!r.tags.includes('budget'))score+=1.2;if(state.priorities.includes('vegetarian')&&!r.tags.includes('vegetarian'))score+=2;if(state.favorites.includes(r.id))score-=1.3}
if(score<bestScore){bestScore=score;best=chosen}if(cart.total<=state.budget&&score<4)break}
if(!best)return false;state.plan=best;state.checked=[];persist();toast('A fresh week is ready ✨');return true}
function screen(title,subtitle,actions=''){return `<div class="page-title"><div><p class="eyebrow">THE FAMILY MENU</p><h1>${title}</h1><p class="lead">${subtitle}</p></div>${actions?`<div class="action-bar">${actions}</div>`:''}</div>`}
function btn(action,text,css='btn',attrs=''){return `<button type="button" class="${css}" data-action="${action}" ${attrs}>${text}</button>`}
function thumb(r,i=0,small=false){return `<div class="food-thumb tint${i%4}" aria-hidden="true"><span>${esc(r?.emoji||'🍽️')}</span></div>`}
function renderPlan(){const cart=getCart(),left=state.budget-cart.total;const current= new Date().getDay();const todayIdx=(current+6)%7;const available=validRecipes().length;
return screen('Your week, sorted.','Seven good dinners. One simple shop. More time for everything else.',`${btn('generate','✳ &nbsp; Plan my week','btn primary')}${btn('save-week','♡ &nbsp; Save week','btn ghost')}${btn('preferences','⚙ &nbsp; Fine-tune','btn ghost')}`)+`
<section class="hero"><div class="hero-copy"><div class="hero-label">✦ &nbsp; GOOD FOOD, GOOD WEEK</div><h2>Less deciding.<br>More dinner.</h2><p>Built around your family, your budget and the supermarket you actually visit.</p>${btn('generate','Plan a new week &nbsp; →','btn white')}</div><div class="hero-art" aria-hidden="true"><span class="hero-orbit"></span><span class="hero-plate">🥘</span><span class="hero-floating">🥕</span></div></section>
<div class="stat-row"><div class="stat"><div class="stat-head">WEEKLY BUDGET <span class="stat-symbol">◌</span></div><div class="stat-value">${fmt(state.budget)}</div><div class="stat-detail">Your dinner-shopping target</div></div><div class="stat"><div class="stat-head">ESTIMATED SHOP <span class="stat-symbol">▤</span></div><div class="stat-value">${fmt(cart.total)}</div><div class="stat-detail">${cart.unknown?`${cart.unknown} unpriced item${cart.unknown===1?'':'s'} · `:''}${cart.entries.length} products</div></div><div class="stat"><div class="stat-head">${left>=0?'BUDGET LEFT':'OVER BUDGET'} <span class="stat-symbol">✳</span></div><div class="stat-value" style="color:${left<0?'#b85e4c':'var(--green)'}">${fmt(Math.abs(left))}</div><div class="stat-detail">Based on estimated pack prices</div><div class="budgetbar ${left<0?'over':''}"><div style="width:${Math.min(100,cart.total/state.budget*100)}%"></div></div></div></div>
${cart.unknown?`<div class="notice">${cart.unknown} products have no saved price, so the estimated shop is incomplete. Add prices in your shopping list for a better total.</div>`:''}
<div class="section-header"><div><h2>On the menu this week <span style="font-size:17px">🍴</span></h2><p class="section-sub">Made for ${state.servings} ${state.servings===1?'person':'people'} · ${available} meals match your preferences</p></div>${btn('shop','See shopping list →','btn small ghost')}</div>
<div class="day-grid">${DAYS.map((day,i)=>{const r=rFor(state.plan[i]);return `<article class="day-card ${i===todayIdx?'today':''}">${thumb(r,i)}<div class="day-content"><div class="day-heading">${day}${i===todayIdx?' · Today':''}</div><h3>${esc(r?.name||'Choose a dinner')}</h3><div class="recipe-meta"><span>◷ ${r?.time||'?'} mins</span><span>♨ ${r?.kcal||'?'} kcal*</span></div><div class="day-actions">${btn('detail','View recipe','',`data-id="${esc(r?.id||'')}"`)}${btn('swap','⇄ Swap','',`data-day="${i}"`)}</div></div></article>`}).join('')}</div>${state.history.length?`<div class="section-header"><h2>Saved weeks</h2><span class="muted">Bring back a favourite plan</span></div><div class="history-grid">${state.history.slice(0,8).map((week,i)=>`<div class="history-card"><div><b>${esc(week.name||'Saved menu')}</b><small>${esc(week.savedAt||'')} · ${esc(week.store||state.store)}</small></div>${btn('restore-week','Restore','btn small ghost',`data-index="${i}"`)}</div>`).join('')}</div>`:''}<p class="footer-note">* Nutrition per serving is a rough recipe estimate, not laboratory verified. Shopping prices are illustrative UK estimates, not live prices or retailer offers.</p>`}
function renderShop(){const cart=getCart();const groups=AISLES.filter(a=>cart.entries.some(e=>e.aisle===a));const extras=cart.entries.filter(e=>!AISLES.includes(e.aisle));if(extras.length)groups.push('Other');return screen('One list. One easy shop.','Every ingredient from your week, combined and sorted in store-aisle groups.',`${btn('copy','⧉ &nbsp; Copy list','btn ghost')}${btn('reset-checks','↻ &nbsp; Untick all','btn ghost')}`)+`<div class="split"><div><section class="panel"><div class="shop-progress"><div><h2>Shopping at ${esc(state.store)}</h2><p class="muted">${cart.done} of ${cart.entries.length} items ticked off</p></div><span class="pill">${Math.round(cart.done/Math.max(1,cart.entries.length)*100)}% done</span></div><div class="budgetbar"><div style="width:${cart.done/Math.max(1,cart.entries.length)*100}%"></div></div><form id="extraForm" class="list-add"><input name="name" required maxlength="80" class="field" aria-label="Add an extra shopping item" placeholder="Add lunches, snacks, milk…"><button class="btn primary" type="submit">+ Add</button></form>
${cart.entries.length?groups.map(aisle=>{const entries=cart.entries.filter(e=>AISLES.includes(e.aisle)?e.aisle===aisle:!AISLES.includes(e.aisle));return `<div class="shop-aisle"><h3>${esc(aisle)}</h3><small>${entries.length} item${entries.length===1?'':'s'}</small></div>${entries.map(e=>`<div class="shopping-item ${e.checked?'done':''}"><input type="checkbox" data-check="${esc(e.id)}" aria-label="Bought ${esc(e.name)}" ${e.checked?'checked':''}><div class="shop-name"><strong>${esc(e.name)}</strong><small>${e.isExtra?esc(e.packLabel):`${esc(e.packLabel)} · need ${esc(quantityText(e.needed,pFor(e.id).unit))}`}</small></div><div class="shop-price">${e.known?fmt(e.price):'—'}${btn('price',e.known?'Edit':'Set price','',`data-id="${esc(e.id)}"`)}</div>${e.isExtra?btn('remove-extra','×','btn icon-btn',`data-id="${esc(e.id)}" aria-label="Remove ${esc(e.name)}"`):''}</div>`).join('')}`}).join(''):`<div class="empty-state"><div class="emoji">🛒</div><h3>Your list is empty</h3><p>Try adding a dinner to your plan, or adding a shopping extra.</p></div>`}<div class="list-total"><div><strong>Estimated total</strong><div class="muted">${cart.unknown?'Plus unpriced items':'Pack-price estimates'}</div></div><strong>${fmt(cart.total)}</strong></div></section></div>
<aside><section class="panel"><p class="eyebrow">YOUR SHOPPING BUDGET</p><div class="stat-value">${fmt(state.budget)}</div><div class="budgetbar ${cart.total>state.budget?'over':''}"><div style="width:${Math.min(100,cart.total/state.budget*100)}%"></div></div><p class="muted">${cart.total>state.budget?`${fmt(cart.total-state.budget)} above your target`:`${fmt(state.budget-cart.total)} estimated remaining`} · ${state.servings} servings per recipe</p><div class="divider"></div><p class="muted">We combine ingredients and round up to whole product packs. A real receipt may differ by store, pack size and promotions.</p>${btn('preferences','Change your budget','btn small ghost')}</section><section class="panel" style="margin-top:14px"><h3>Already got it?</h3><p class="muted">Use your cupboard to remove ingredients you already own. This updates the shopping total.</p>${btn('pantry','Check my cupboard →','btn small ghost')}</section><section class="panel" style="margin-top:14px"><h3>Price guide</h3><p class="muted">Prices are editable <b>illustrative estimates</b>, not live Lidl or Sainsbury’s pricing. Nectar and Lidl Plus deals aren't connected.</p></section></aside></div>`}
let searchResults=()=>{const query=ui.query.toLowerCase().trim();let result=recipes().filter(r=>r.name.toLowerCase().includes(query)||r.category.toLowerCase().includes(query)||r.ingredients.some(i=>pFor(i.product).name.toLowerCase().includes(query)));if(ui.filter==='Favourites')result=result.filter(r=>state.favorites.includes(r.id));else if(ui.filter==='Suitable')result=result.filter(canUse);else if(ui.filter==='Quick')result=result.filter(r=>r.time<=30);else if(ui.filter==='High protein')result=result.filter(r=>r.protein>=35);else if(ui.filter==='Vegetarian')result=result.filter(r=>r.tags.includes('vegetarian'));else if(ui.filter!=='All')result=result.filter(r=>r.category===ui.filter);return result}
function recipeCards(){const result=searchResults();return `<div class="section-header"><h2>${result.length} delicious idea${result.length===1?'':'s'}</h2><span class="muted">Tap a recipe for ingredients & steps</span></div>${result.length?`<div class="recipe-grid">${result.map((r,i)=>`<article class="recipe-card"><div class="recipe-cover tint${i%4}"><span class="food-emoji" aria-hidden="true">${esc(r.emoji)}</span>${btn('favourite',state.favorites.includes(r.id)?'♥':'♡',`favourite ${state.favorites.includes(r.id)?'active':''}`,`data-id="${esc(r.id)}" aria-label="${state.favorites.includes(r.id)?'Remove favourite':'Add favourite'}: ${esc(r.name)}"`)}</div><div class="recipe-card-body"><span class="pill peach">${esc(r.category)}</span><h3>${esc(r.name)}</h3><div class="recipe-meta">◷ ${r.time} mins <span>♨ ${r.kcal} kcal*</span></div><div class="recipe-card-footer"><span class="muted">${r.protein}g protein*</span>${btn('detail','View recipe →','btn small ghost',`data-id="${esc(r.id)}"`)}</div></div></article>`).join('')}</div>`:`<div class="panel empty-state"><div class="emoji">🥑</div><h3>No matching recipes yet</h3><p>Try another search, or change the food preferences in Settings.</p>${btn('clear-filters','Clear search & filters','btn primary')}</div>`}`}
function renderDiscover(){const tabs=['All','Suitable','Favourites','Quick','High protein','Vegetarian'];return screen('What sounds good?','Browse real, doable family dinners. Save favourites and put any recipe on your week.',btn('new-recipe','+ &nbsp; My own recipe','btn primary'))+`<div class="search-box"><span aria-hidden="true">⌕</span><input id="recipeSearch" class="field" type="search" placeholder="Search chicken, pasta, quick dinners…" aria-label="Search recipes" value="${escapeAttr(ui.query)}"></div><div class="filters" id="recipeFilters">${tabs.map(f=>`<button class="choice ${ui.filter===f?'selected':''}" data-filter="${esc(f)}">${f==='Favourites'?'♡ ':''}${esc(f)}</button>`).join('')}</div><div id="recipeResults">${recipeCards()}</div><p class="footer-note">* Calories and protein are rough, per-serving estimates. Recipes may require adjustments for allergies or medical diets.</p>`}
function renderPantry(){const all=Object.values(products()).sort((a,b)=>a.name.localeCompare(b.name));const owned=state.pantry.map(id=>pFor(id)).filter(x=>x.name);return screen('Shop your cupboard first.','Tell us what you already have and we’ll leave it off your shopping list.')+`<div class="split"><section class="panel"><h2>What’s in your kitchen?</h2><p class="muted">${owned.length} ingredients marked as already owned</p><form id="pantryForm" class="list-add"><select id="pantryProduct" name="product" class="select" aria-label="Choose an ingredient to add">${all.filter(x=>!state.pantry.includes(x.id)).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><button class="btn primary" type="submit">+ Add</button></form><div class="category-header">IN YOUR CUPBOARD</div>${owned.length?`<div class="cupboard-grid">${owned.map(p=>`<label class="cupboard-item"><input data-pantry-toggle="${esc(p.id)}" type="checkbox" checked><span>${esc(p.name)}</span></label>`).join('')}</div>`:`<div class="empty-state"><div class="emoji">🧂</div><h3>Nothing here yet</h3><p>Add pantry staples you have at home.</p></div>`}</section><aside><div class="panel"><h3>Why this helps</h3><p class="muted">Already have rice, oil or spices? We won’t add another pack to your shopping list, saving you money and waste.</p><div class="notice green">Tip: update your cupboard before you generate a fresh meal plan.</div>${btn('shop','Back to shopping →','btn ghost')}</div></aside></div>`}
function renderSettings(){return screen('Made for your family.','Set this once. Every new week will work around what matters to you.')+`<div class="narrow"><div class="pref-card"><h3>01 &nbsp; Your budget & your shop</h3><div class="form-grid"><div><label class="field-label" for="budgetSetting">Dinner-shopping budget (£ per week)</label><input id="budgetSetting" class="field" type="number" min="1" max="10000" step="1" value="${state.budget}"></div><div><label class="field-label" for="servingsSetting">People eating dinner</label><input id="servingsSetting" class="field" type="number" min="1" max="20" value="${state.servings}"></div></div><p class="field-hint">This budget covers the planned dinners and anything extra you add to the list, not an entire supermarket basket unless you enter everything.</p></div>
<div class="pref-card"><h3>02 &nbsp; What matters most?</h3><p class="muted">Choose as many as you like; planning takes them into account.</p><div class="choice-row">${PRIORITIES.map(([id,name])=>`<button class="choice ${state.priorities.includes(id)?'selected':''}" data-priority="${id}">${esc(name)}</button>`).join('')}</div></div>
<div class="pref-card"><h3>03 &nbsp; Dietary preferences</h3><div class="form-group"><label for="dietSetting" class="field-label">General meal preference</label><select id="dietSetting" class="select"><option value="any" ${state.diet==='any'?'selected':''}>No specific diet</option><option value="vegetarian" ${state.diet==='vegetarian'?'selected':''}>Vegetarian</option><option value="pescatarian" ${state.diet==='pescatarian'?'selected':''}>Pescatarian</option><option value="gluten-free" ${state.diet==='gluten-free'?'selected':''}>Avoid common gluten ingredients</option><option value="dairy-free" ${state.diet==='dairy-free'?'selected':''}>Avoid dairy ingredients</option></select></div><label for="avoidSetting" class="field-label">Ingredients your family doesn't like</label><textarea id="avoidSetting" class="textarea" rows="2" placeholder="e.g. mushrooms, prawns, tofu">${esc(state.avoid)}</textarea><p class="field-hint">Separate foods with commas. Ingredient filtering is approximate and is <b>not an allergy or cross-contamination safety check</b>. Check all product labels yourself.</p></div>
<div class="pref-card"><h3>04 &nbsp; What can you cook with?</h3><p class="muted">We'll only suggest meals you have the equipment to make.</p><div class="choice-row">${APPLIANCES.map(([id,name])=>`<button class="choice ${state.appliances.includes(id)?'selected':''}" data-appliance="${id}">${esc(name)}</button>`).join('')}</div></div>
<div class="pref-card"><h3>Your plans and backups</h3><p class="muted">Everything is saved locally in this browser. No account or subscription needed. It does <b>not</b> sync between phones or browsers.</p><div class="data-actions">${btn('export','↓ Download backup','btn ghost')}<label class="btn ghost" for="importFile" style="cursor:pointer">↑ Import backup</label><input type="file" id="importFile" accept="application/json,.json" class="sr-only">${btn('reset-app','Reset all data','btn ghost')}</div></div>
${btn('settings-save','Save preferences','btn primary')}<p class="footer-note">Personal-use planner, not affiliated with Whipp, Lidl or Sainsbury's. Prices, estimated quantities and nutrition are illustrative, and product availability varies.</p></div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(x=>{x.classList.toggle('active',x.dataset.nav===ui.tab);if(x.dataset.nav===ui.tab)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});const store=$('storePicker');if(store)store.value=state.store;const content={plan:renderPlan,shop:renderShop,discover:renderDiscover,pantry:renderPantry,settings:renderSettings};$('main').innerHTML=(content[ui.tab]||renderPlan)()}
function navigate(tab){if(!['plan','shop','discover','pantry','settings'].includes(tab))return;ui.tab=tab;ui.modal=null;closeModal();render();window.scrollTo({top:0,behavior:'instant'})}
function toast(message){const e=$('toast');e.textContent=message;e.classList.add('visible');clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>e.classList.remove('visible'),3500)}
function showModal(inner,large=false){$('modalRoot').innerHTML=`<div class="modal-backdrop" data-backdrop="1"><div class="modal ${large?'modal-large':''}" role="dialog" aria-modal="true" aria-label="Family menu dialog"><button class="modal-close" data-action="close-modal" aria-label="Close dialog">×</button>${inner}</div></div>`;document.body.style.overflow='hidden';const focus=$('modalRoot').querySelector('input,select,button:not(.modal-close)');focus?.focus({preventScroll:true})}
function closeModal(){if(ui.modal==='onboard'&&!state.onboarded)return;ui.modal=null;$('modalRoot').innerHTML='';document.body.style.overflow=''}
function detailModal(id){const r=rFor(id);if(!r)return;ui.modal='detail';ui.currentRecipe=id;const addOptions=DAYS.map((day,i)=>`<option value="${i}">${day}</option>`).join('');showModal(`<div class="detail-hero tint${Math.max(0,recipes().indexOf(r))%4}" aria-hidden="true">${esc(r.emoji)}</div><div class="modal-body"><p class="eyebrow">${esc(r.category)}</p><h2>${esc(r.name)}</h2><p class="modal-description">A real dinner with straightforward, family-friendly steps.</p><div class="pill-row"><span class="pill">◷ ${r.time} mins</span><span class="pill peach">🍽 ${state.servings} servings</span>${r.tags.includes('vegetarian')?'<span class="badge-diet">Vegetarian</span>':''}</div><div class="nutrition"><div><strong>${r.kcal}</strong><small>kcal / serving*</small></div><div><strong>${r.protein}g</strong><small>protein / serving*</small></div><div><strong>${r.time}m</strong><small>total time</small></div></div><h3>What you'll need</h3>${r.ingredients.map(i=>`<div class="ingredient-row"><span>${esc(pFor(i.product).name)}</span><span>${esc(quantityText(i.quantity*state.servings/4,pFor(i.product).unit))}</span></div>`).join('')}<h3 style="margin:24px 0 12px">Let's cook</h3><ol class="step-list">${r.steps.map((step,i)=>`<li><span class="number">${i+1}</span><span>${esc(step)}</span></li>`).join('')}</ol><div class="divider"></div><div class="form-grid"><div><label for="addDay" class="field-label">Add this meal to</label><select class="select" id="addDay">${addOptions}</select></div><div style="align-self:end">${btn('add-to-day','Add to my week →','btn primary',`data-id="${esc(r.id)}"`)}</div></div><div class="form-actions" style="margin-top:15px">${btn('favourite',state.favorites.includes(id)?'♥ Saved favourite':'♡ Save favourite','btn ghost',`data-id="${esc(r.id)}"`)}${r.custom?btn('edit-recipe','✎ Edit recipe','btn ghost',`data-id="${esc(r.id)}"`):''}</div><p class="fine-print" style="margin-top:16px">* Nutrition is an approximate estimate. Check ingredients and packaging for dietary suitability.</p></div>`,true)}
function swapModal(day){const current=DAYS[day];ui.modal='swap';ui.swapDay=day;ui.swapQuery='';renderSwapModal()}
function renderSwapModal(){const pool=validRecipes().filter(r=>r.name.toLowerCase().includes(ui.swapQuery.toLowerCase()));showModal(`<div class="modal-body"><p class="eyebrow">MAKE IT YOURS</p><h2>Swap ${DAYS[ui.swapDay]}'s dinner</h2><p class="modal-description">Change just one dinner. Your shopping list updates automatically.</p><div class="search-box"><span aria-hidden="true">⌕</span><input id="swapSearch" class="field" placeholder="Find another meal…" value="${escapeAttr(ui.swapQuery)}"></div><div class="swap-list" id="swapResults">${swapItems(pool)}</div></div>`,true)}
function swapItems(pool){return pool.length?pool.map((r,i)=>`<div class="swap-item">${thumb(r,i)}<div style="flex:1"><h3>${esc(r.name)}</h3><div class="muted">${r.time} mins · ${r.kcal} kcal*</div></div>${btn('choose-swap','Choose','btn small primary',`data-id="${esc(r.id)}"`)}</div>`).join(''):`<p class="muted">No meals match. Try changing your preferences.</p>`}
function priceModal(id){const p=id.startsWith('extra:')?state.extras.find(x=>'extra:'+x.id===id):pFor(id);if(!p)return;ui.modal='price';ui.priceId=id;const current=packPrice(id);const price=id.startsWith('extra:')?(state.priceOverrides[state.store+'|'+id]??p.prices?.[state.store]??''):current;showModal(`<div class="modal-body"><p class="eyebrow">MAKE THE ESTIMATE YOURS</p><h2>${esc(p.name)}</h2><p class="modal-description">Update what one pack costs at ${esc(state.store)}. This will be saved for future lists at this shop.</p><form id="priceForm"><label for="priceInput" class="field-label">Price per pack (£)</label><input id="priceInput" name="price" required class="field" min="0" step="0.01" type="number" value="${price||''}" placeholder="e.g. 2.49"><p class="field-hint">These are your prices, not live prices or Lidl Plus / Nectar offers.</p><button type="submit" class="btn primary">Save price</button></form></div>`)}
function onboard(){ui.modal='onboard';showModal(`<div class="modal-body"><div class="onboard-art"><span>🥘</span></div><p class="eyebrow">WELCOME TO YOUR NEW DINNER ROUTINE</p><h2>A whole week of dinners, sorted.</h2><p class="modal-description">Tell us where you shop and what you'd like to spend. We’ll handle the ideas and the list.</p><form id="onboardForm"><div class="form-grid"><div class="form-group"><label for="onboardStore" class="field-label">Your supermarket</label><select id="onboardStore" class="select"><option ${state.store==='Lidl'?'selected':''}>Lidl</option><option ${state.store==="Sainsbury's"?'selected':''}>Sainsbury's</option></select></div><div class="form-group"><label class="field-label" for="onboardBudget">Dinner budget / week</label><input class="field" type="number" id="onboardBudget" value="${state.budget}" min="1" max="10000" required></div></div><div class="form-group"><label for="onboardPeople" class="field-label">How many people?</label><input class="field" type="number" id="onboardPeople" value="${state.servings}" min="1" max="20" required></div><button type="submit" class="btn primary" style="width:100%;margin:7px 0">Make my first meal plan →</button></form><p class="fine-print">Free for personal use. No account or subscription. Save your preferences any time in Settings.</p></div>`)}
function recipeForm(id){const r=id?rFor(id):null;if(r&&!r.custom)return;ui.modal='recipe-form';ui.customEditId=id||null;showModal(`<div class="modal-body"><p class="eyebrow">YOUR KITCHEN, YOUR RECIPES</p><h2>${r?'Edit your recipe':'Add your own recipe'}</h2><p class="modal-description">Save family favourites and add them straight to your week.</p><form id="recipeForm"><div class="form-grid"><div class="form-group"><label class="field-label" for="recipeName">Name of meal</label><input class="field" id="recipeName" maxlength="100" required value="${escapeAttr(r?.name||'')}" placeholder="e.g. Friday chicken wraps"></div><div class="form-group"><label class="field-label" for="recipeTime">Minutes</label><input class="field" id="recipeTime" type="number" min="1" max="300" required value="${r?.time||25}"></div></div><div class="form-grid"><div class="form-group"><label class="field-label" for="recipeKcal">Approx. kcal / serving (optional)</label><input class="field" id="recipeKcal" type="number" min="0" max="3000" value="${r?.kcal||''}" placeholder="e.g. 500"></div><div class="form-group"><label class="field-label" for="recipeProtein">Approx. protein g / serving</label><input class="field" id="recipeProtein" type="number" min="0" max="300" value="${r?.protein||''}" placeholder="e.g. 30"></div></div><div class="form-group"><label class="field-label" for="recipeIngredients">Ingredients (one per line)</label><textarea class="textarea" id="recipeIngredients" rows="6" required placeholder="Chicken breast | 600\nSoft tortilla wraps | 8\nCucumber | 1">${esc(r?r.ingredients.map(i=>pFor(i.product).name+' | '+i.quantity).join('\n'):'')}</textarea><p class="field-hint">Enter ingredient name | quantity for 4 people. We’ll match known supermarket products. New ingredients start with no price until you add one.</p></div><div class="form-group"><label class="field-label" for="recipeSteps">Method (one step per line)</label><textarea class="textarea" id="recipeSteps" rows="5" required placeholder="Cook chicken until fully cooked.\nWarm the wraps.\nServe with toppings on the side.">${esc(r?.steps.join('\n')||'')}</textarea></div><label class="field-label" for="recipeEmoji">Dish emoji</label><input class="field" id="recipeEmoji" maxlength="8" value="${escapeAttr(r?.emoji||'🍽️')}" style="max-width:120px"><div class="form-actions" style="margin-top:17px"><button class="btn primary" type="submit">${r?'Save changes':'Save my recipe'}</button>${r?btn('delete-recipe','Delete recipe','btn ghost',`data-id="${esc(r.id)}"`):''}</div></form></div>`,true)}
function parseNewRecipe(form){const name=form.querySelector('#recipeName').value.trim();const time=Number(form.querySelector('#recipeTime').value);const lines=form.querySelector('#recipeIngredients').value.split('\n').map(x=>x.trim()).filter(Boolean);const steps=form.querySelector('#recipeSteps').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!name||!steps.length||!lines.length||lines.length>50||!Number.isFinite(time)||time<1||time>300){toast('Please check the recipe details.');return null}
const candidates=products();const newProducts={};const ingredients=[];for(const line of lines){const [raw,qraw]=line.split('|').map(x=>x.trim());if(!raw){toast('Every ingredient needs a name.');return null}const match=Object.values({...candidates,...newProducts}).find(p=>p.name.toLowerCase()===raw.toLowerCase());const product=match?.id||'custom-'+uid();const q=Number(qraw||1);if(!Number.isFinite(q)||q<=0||q>100000){toast('Use positive numbers for ingredient quantities.');return null}if(!match)newProducts[product]={id:product,name:raw.slice(0,90),aisle:'Other',unit:'pcs',pack:1,prices:{Lidl:0,"Sainsbury's":0}};ingredients.push({product,quantity:q})}
return {recipe:{id:ui.customEditId||'my-'+uid(),name:name.slice(0,100),time,emoji:form.querySelector('#recipeEmoji').value.trim()||'🍽️',kcal:Number(form.querySelector('#recipeKcal').value)||0,protein:Number(form.querySelector('#recipeProtein').value)||0,category:'My recipes',tags:['family'],appliances:['hob'],ingredients,steps,custom:true},newProducts}}
function handleClick(e){const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const filter=e.target.closest('[data-filter]');if(filter){ui.filter=filter.dataset.filter;render();return}const priority=e.target.closest('[data-priority]');if(priority){const id=priority.dataset.priority;state.priorities=state.priorities.includes(id)?state.priorities.filter(x=>x!==id):[...state.priorities,id];persist();return}const appliance=e.target.closest('[data-appliance]');if(appliance){const id=appliance.dataset.appliance;if(state.appliances.includes(id)&&state.appliances.length===1){toast('Choose at least one appliance');return}state.appliances=state.appliances.includes(id)?state.appliances.filter(x=>x!==id):[...state.appliances,id];persist();return}
const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action,id=action.dataset.id;switch(a){case 'preferences':case 'settings':navigate('settings');break;case 'shop':navigate('shop');break;case 'pantry':navigate('pantry');break;case 'generate':generatePlan();break;case 'save-week':{const today=new Date();state.history=[{name:'Week saved '+today.toLocaleDateString('en-GB',{day:'numeric',month:'short'}),savedAt:today.toLocaleDateString('en-GB'),store:state.store,plan:[...state.plan]},...state.history].slice(0,20);persist();toast('This week saved to your collection');break}case 'restore-week':{const history=state.history[Number(action.dataset.index)];if(!history||!Array.isArray(history.plan)||history.plan.length!==7)return;state.plan=[...history.plan];state.checked=[];persist();toast('Your saved week is back');break}case 'detail':detailModal(id);break;case 'swap':swapModal(Number(action.dataset.day));break;case 'choose-swap':state.plan[ui.swapDay]=id;state.checked=[];persist();closeModal();toast('Dinner swapped! Shopping list updated.');break;case 'favourite':state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();if(ui.modal==='detail')detailModal(id);break;case 'close-modal':if(ui.modal==='onboard'&&!state.onboarded){state.onboarded=true;persist()}closeModal();break;case 'add-to-day':{const day=Number($('addDay')?.value||0);state.plan[day]=id;state.checked=[];persist();closeModal();toast(`${DAYS[day]}'s dinner updated`);break}case 'new-recipe':recipeForm();break;case 'edit-recipe':recipeForm(id);break;case 'delete-recipe':{if(!confirm('Delete this recipe from your collection?'))return;state.recipes=state.recipes.filter(r=>r.id!==id);state.plan=state.plan.map(x=>x===id?'wraps':x);state.favorites=state.favorites.filter(x=>x!==id);persist();closeModal();toast('Recipe deleted');break}case 'price':priceModal(id);break;case 'remove-extra':state.extras=state.extras.filter(x=>'extra:'+x.id!==id);state.checked=state.checked.filter(x=>x!=='p:'+id);persist();break;case 'copy':copyList();break;case 'reset-checks':state.checked=[];persist();toast('All items unticked');break;case 'clear-filters':ui.query='';ui.filter='All';render();break;case 'settings-save':saveSettings();toast('Preferences saved');break;case 'export':exportData();break;case 'reset-app':if(confirm('Delete all saved meal plans, recipes, prices and preferences on this device?')){localStorage.removeItem(STORE_KEY);state=clone(DEFAULT);ui.tab='plan';persist();onboard()}break;}}
function saveSettings(){const budget=$('budgetSetting'),servings=$('servingsSetting'),diet=$('dietSetting'),avoid=$('avoidSetting');if(!budget||!servings)return;state.budget=Math.max(1,Math.min(10000,Number(budget.value)||75));state.servings=Math.max(1,Math.min(20,Math.round(Number(servings.value)||4)));state.diet=diet.value;state.avoid=avoid.value.trim().slice(0,500);persist()}
function handleChange(e){if(e.target.id==='storePicker'){state.store=e.target.value;state.checked=[];persist();return}if(e.target.id==='budgetSetting'||e.target.id==='servingsSetting'||e.target.id==='dietSetting'||e.target.id==='avoidSetting'){saveSettings();return}if(e.target.dataset.check){const key='p:'+e.target.dataset.check;state.checked=e.target.checked?[...new Set([...state.checked,key])]:state.checked.filter(x=>x!==key);persist();return}if(e.target.dataset.pantryToggle){const id=e.target.dataset.pantryToggle;state.pantry=e.target.checked?[...new Set([...state.pantry,id])]:state.pantry.filter(x=>x!==id);persist();return}if(e.target.id==='importFile'){importData(e.target.files?.[0]);return}}
async function handleSubmit(e){const form=e.target;switch(form.id){case 'extraForm':{e.preventDefault();const name=form.elements.name.value.trim();if(!name)return;const match=state.extras.find(x=>x.name.toLowerCase()===name.toLowerCase());if(match)match.quantity++;else state.extras.push({id:uid(),name:name.slice(0,80),quantity:1,aisle:'Other',prices:{}});persist();toast('Added to your shopping list');return}case 'pantryForm':e.preventDefault();if(form.elements.product.value)state.pantry=[...new Set([...state.pantry,form.elements.product.value])];persist();toast('Added to cupboard');return;case 'onboardForm':e.preventDefault();state.store=$('onboardStore').value;state.budget=Math.max(1,Math.min(10000,Number($('onboardBudget').value)||75));state.servings=Math.max(1,Math.min(20,Number($('onboardPeople').value)||4));state.onboarded=true;generatePlan();closeModal();return;case 'priceForm':e.preventDefault();{const p=Number($('priceInput').value);if(!Number.isFinite(p)||p<0||p>10000){toast('Enter a valid pack price');return}state.priceOverrides[state.store+'|'+ui.priceId]=p;persist();closeModal();toast('Pack price saved');return}case 'recipeForm':e.preventDefault();{const parsed=parseNewRecipe(form);if(!parsed)return;state.customProducts={...state.customProducts,...parsed.newProducts};if(ui.customEditId)state.recipes=state.recipes.map(r=>r.id===ui.customEditId?parsed.recipe:r);else state.recipes.push(parsed.recipe);persist();closeModal();toast('Your recipe is saved');return}}}
function copyList(){const c=getCart();const text=`${state.store} shopping list · The Family Menu\n${c.entries.map(x=>`${x.checked?'☑':'☐'} ${x.name} — ${x.packLabel}${x.known?' · '+fmt(x.price):''}`).join('\n')}\nEstimated total: ${fmt(c.total)}${c.unknown?' + unpriced items':''}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Shopping list copied!')).catch(()=>fallbackCopy(text));else fallbackCopy(text)}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.append(t);t.select();try{document.execCommand('copy');toast('Shopping list copied!')}catch{toast('Copy isn’t supported in this browser.')}t.remove()}
function exportData(){const json=JSON.stringify({app:'The Family Menu',exportedAt:new Date().toISOString(),state},null,2);const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='family-menu-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded')}
async function importData(file){if(!file)return;try{if(file.size>3_000_000)throw Error('File too large');const raw=JSON.parse(await file.text());const s=raw.state||raw;if(!Array.isArray(s.plan)||s.plan.length!==7||!Array.isArray(s.recipes)||!Array.isArray(s.pantry)||!['Lidl',"Sainsbury's"].includes(s.store))throw Error('Invalid backup');if(!confirm('Replace your current saved plans, recipes and shopping prices with this backup?'))return;state={...clone(DEFAULT),...s};state.onboarded=true;persist();toast('Backup restored')}catch{toast('That backup file could not be imported.')}}
function handleInput(e){if(e.target.id==='recipeSearch'){const start=e.target.selectionStart;ui.query=e.target.value;const results=$('recipeResults');if(results)results.innerHTML=recipeCards();return}if(e.target.id==='swapSearch'){ui.swapQuery=e.target.value;const results=$('swapResults');if(results)results.innerHTML=swapItems(validRecipes().filter(r=>r.name.toLowerCase().includes(ui.swapQuery.toLowerCase())))} }
document.addEventListener('click',e=>{if(e.target.matches('[data-backdrop]')){if(ui.modal==='onboard'&&!state.onboarded)return;closeModal();return}handleClick(e)});
document.addEventListener('change',handleChange);document.addEventListener('submit',handleSubmit);document.addEventListener('input',handleInput);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal&&ui.modal!=='onboard')closeModal()});
$('openPreferences').addEventListener('click',()=>navigate('settings'));
render();if(!state.onboarded)onboard();
if('serviceWorker'in navigator)window.addEventListener('load',()=>Promise.resolve().catch(()=>{}));
// Expose only read-only diagnostics for automated smoke testing.
window.familyMenuDiagnostics=()=>({version:state.version,store:state.store,plan:[...state.plan],recipeCount:recipes().length,cart:getCart().total,cartCount:getCart().entries.length,storageOk});

</script>
